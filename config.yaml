train_size: 0.7
validation_size: 0.1
test_size: 0.2
random_seed: 42
training_loss: 'mean_squared_error'
num_clients_train: 100
random_seed: 42
horizon: 24
context_window: 168

Lasso_params:
  alpha: 0.1

XGBoost_params:
  # obtained via optuna hyperparameter tuning
  learning_rate: 0.0930715859655225
  max_depth: 5
  min_child_weight: 9
  subsample: 0.9474115813088726
  colsample_bytree: 0.7066451333360332
  lambda: 0.3275915469518087
  n_estimators: 200
  early_stop_rounds: 10

LSTM_params:
  seq_length: 168
  batch_size: 32
  train_stride_low: 13
  train_stride_high: 23
  validate_stride: 12
  test_stride: 1
  hidden_size: 10
  learning_rate: 1.0e-4
  weight_decay: 1.0e-3
  epochs: 50
  patience: 5
  delta: 1.0e-3

optuna_params:
  n_trials: 20
  timeout: 600
